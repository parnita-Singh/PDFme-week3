[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfme"
version = "0.1.0"
description = "Local, offline PDF toolkit for compression, background removal, merge, and split"
requires-python = ">=3.11"
dependencies = [
  "pikepdf>=9.0",
  "pypdf>=5.0",
  "Pillow>=10.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["gradio>=4.0"]
bg = ["rembg>=2.0", "onnxruntime>=1.17"]
classify = ["ollama>=0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.setuptools.packages.find]
include = ["pdftoolkit*"]